<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:340px;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;padding:16px;background:#f1f8f2;color:#1a1a2e}
h1{font-size:16px;color:#2e7d32;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.status{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#e8f5e9;border-radius:8px;margin-bottom:12px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#4caf50;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.site-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tag{font-size:11px;padding:3px 8px;background:#fff;border:1px solid #c8e6c9;border-radius:4px;color:#2e7d32}
.footer{font-size:11px;color:#888;border-top:1px solid #c8e6c9;padding-top:8px;margin-top:4px}
.btn{display:block;width:100%;padding:8px;background:#43a047;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;margin-bottom:8px}
.btn:hover{background:#388e3c}
</style></head>
<body>
<h1>⚡ 多AI工坊 Helper</h1>
<div class="status">
  <span class="dot"></span>
  <span><strong>插件已激活</strong> · 已解除 AI 网站 iframe 限制</span>
</div>
<p style="font-size:12px;color:#555;margin-bottom:8px">✅ 支持的 AI 网站：</p>
<div class="site-list" id="sitelist"></div>
<div class="footer">
  💡 安装后刷新多AI工坊页面即可生效<br>
  如果某网站仍然显示受限，请反馈给我添加规则
</div>
<script>
const sites = [
  "ChatGPT","DeepSeek","通义千问","Kimi","豆包","元宝",
  "智谱清言","讯飞星火","文心一言","秘塔AI","Perplexity","Claude","Gemini"
];
document.getElementById("sitelist").innerHTML = sites.map(s => `<span class="tag">${s}</span>`).join("");
</script>
</body>
</html>
